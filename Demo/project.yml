# PixLab — the standalone harness for PixKit. Generate the project with:
#   cd Demo && xcodegen generate
# The generated PixLab.xcodeproj is committed (matching CalendarLab).
name: PixLab
options:
  bundleIdPrefix: dev.scalecode
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  PixKit:
    path: ..
  MvAuth-iOS:
    url: https://github.com/scalecode-solutions/MvAuth-iOS.git
    branch: main
settings:
  base:
    DEVELOPMENT_TEAM: YBFJUNLFT6
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
targets:
  PixLab:
    type: application
    platform: iOS
    sources:
      - PixLab
    dependencies:
      - package: PixKit
      - package: MvAuth-iOS
        product: MvAuth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.scalecode.PixLab
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PixLab
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: "Take photos and videos to share in a space."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Record sound for videos and audio clips."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Pick photos and videos to share in a space."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Save photos and videos from a space."
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
  PixLabUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - PixLabUITests
    dependencies:
      - target: PixLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.scalecode.PixLabUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PixLab
        CODE_SIGN_STYLE: Automatic
schemes:
  PixLab:
    build:
      targets:
        PixLab: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PixLabUITests
